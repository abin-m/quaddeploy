name: integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: sigstore/cosign-installer@v3
      - name: Start a systemd user session
        # The runner's shell has no user session. Lingering starts the user manager,
        # and these two variables let systemctl --user and rootless Podman find it.
        run: |
          sudo loginctl enable-linger "$USER"
          runtime_dir="/run/user/$(id -u)"
          timeout 30 sh -c "until [ -S '$runtime_dir/bus' ]; do sleep 1; done"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus" >> "$GITHUB_ENV"
      - name: Show tool versions
        run: |
          podman --version
          cosign version
          systemctl --user is-system-running || true
      - run: pip install -e '.[dev]'
      - name: Run the end-to-end tests
        run: pytest tests/integration -v
        env:
          QUADDEPLOY_E2E: "1"
      - name: Show the unit's journal
        if: failure()
        run: |
          journalctl --user --no-pager -n 150 || true
          podman ps -a || true
