# Build the demo image, push it to GitHub Container Registry and sign it with cosign.
#
# The signature is tied to this workflow's identity, so there is no signing key to store.
# On the host, trust that identity in ~/.config/quaddeploy/config.toml:
#
#   [verify]
#   certificate_identity = "https://github.com/alice/app/.github/workflows/image.yml@refs/heads/main"
#   certificate_oidc_issuer = "https://token.actions.githubusercontent.com"

name: image

on:
  push:
    branches: [main]
    paths:
      - examples/demo-app/**
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Lets cosign sign with this workflow's identity, with no stored key.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      # QEMU and Buildx let the amd64 runner build the arm64 image too.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set the image name
        # ghcr.io needs a lower-case owner.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quaddeploy-demo" >> "$GITHUB_ENV"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: examples/demo-app
          file: examples/demo-app/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:main
          build-args: APP_VERSION=${{ github.sha }}
      - name: Sign the image by digest
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
