name: image

on:
  push:
    branches: [main]
    paths:
      - examples/demo-app/**
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Lets cosign sign with this workflow's identity, with no stored key.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set the image name
        # ghcr.io needs a lower-case owner.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quaddeploy-demo" >> "$GITHUB_ENV"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: examples/demo-app
          file: examples/demo-app/Containerfile
          push: true
          tags: ${{ env.IMAGE }}:main
          build-args: APP_VERSION=${{ github.sha }}
      - name: Sign the image by digest
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
