# Copy to ~/.config/quaddeploy/config.toml. For a fork, replace abin-m with its owner.

[repo]
url = "https://github.com/abin-m/quaddeploy.git"
branch = "main"
path = "examples/deploy"

# For a private repo, use the SSH form of the URL and give the host a read-only deploy key.
# url = "git@github.com:abin-m/quaddeploy.git"
# ssh_key = "~/.config/quaddeploy/deploy_key"

# To accept only signed commits, list the trusted SSH keys in this file and remove the #.
# allowed_signers = "~/.config/quaddeploy/allowed_signers"

# Accept only images signed by this repo's image workflow on the main branch.
[verify]
certificate_identity = "https://github.com/abin-m/quaddeploy/.github/workflows/image.yml@refs/heads/main"
certificate_oidc_issuer = "https://token.actions.githubusercontent.com"

# To verify with a public key instead, remove the two lines above and set:
# key = "~/.config/quaddeploy/cosign.pub"

[health]
timeout = 60
interval = 2
urls = ["http://127.0.0.1:8080/healthz"]

# For a private image, log in with: podman login --authfile PATH REGISTRY
# [registry]
# authfile = "~/.config/containers/auth.json"

# To be told when a deploy fails, rolls back or recovers, set a webhook and remove the #.
# [notify]
# url = "https://hooks.example.com/your-webhook"
