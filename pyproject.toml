[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quaddeploy"
version = "0.1.0"
description = "Pull-based deployment for a single host with rootless Podman, systemd Quadlets and signed images"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
quaddeploy = "quaddeploy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quaddeploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
